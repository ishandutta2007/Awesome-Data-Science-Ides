<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Filter for subtle drop-shadow/glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-14px) translateX(8px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
    @keyframes pillPulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }

    .glow-blob-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 250px 120px;
    }
    .glow-blob-2 {
      animation: pulseGlow 9s ease-in-out infinite reverse;
      transform-origin: 950px 220px;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out 1.5s infinite; }
    .particle-3 { animation: floatParticle 6s ease-in-out 3s infinite; }
    .particle-4 { animation: floatParticle 8s ease-in-out 0.8s infinite; }
    .wave-line {
      stroke-dasharray: 12, 16;
      animation: waveFlow 25s linear infinite;
    }
    .pill-border {
      animation: pillPulse 3.5s ease-in-out infinite;
    }

    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambiance in Background (strictly behind text) -->
  <g id="dynamic-background-elements">
    <ellipse cx="250" cy="130" rx="220" ry="140" fill="url(#glowGrad1)" class="glow-blob-1" />
    <ellipse cx="960" cy="240" rx="260" ry="160" fill="url(#glowGrad2)" class="glow-blob-2" />

    <!-- Animated Dynamic Flow Lines in Background -->
    <path d="M 0,100 C 300,160 600,40 1200,120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" class="wave-line" />
    <path d="M 0,260 C 400,190 800,320 1200,230" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.2" class="wave-line" />

    <!-- Dynamic Animated Floating Particles -->
    <circle cx="140" cy="80" r="3" fill="#38bdf8" class="particle-1" />
    <circle cx="320" cy="290" r="2.5" fill="#818cf8" class="particle-2" />
    <circle cx="880" cy="70" r="3.5" fill="#c084fc" class="particle-3" />
    <circle cx="1060" cy="180" r="2.5" fill="#f472b6" class="particle-4" />
    <circle cx="580" cy="50" r="2" fill="#38bdf8" class="particle-2" />
    <circle cx="700" cy="330" r="3" fill="#818cf8" class="particle-1" />
  </g>

  <!-- Elegant Outer Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- FOREGROUND CONTENT: Guaranteed pristine visibility & hierarchy -->
  <g id="foreground-content">
    <!-- Top Category Badge -->
    <g transform="translate(480, 48)">
      <rect x="0" y="0" width="240" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="32" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" class="main-title" fill="url(#titleGrad)" font-size="44" filter="url(#subtleGlow)">
      Awesome Data Science IDEs
    </text>

    <!-- Subtitle -->
    <text x="600" y="188" text-anchor="middle" class="sub-title" fill="#e2e8f0" font-size="19">
      Curated Ecosystem of Cloud Workbenches, Interactive Notebooks &amp; Open-Source Environments
    </text>

    <text x="600" y="218" text-anchor="middle" class="sub-title" fill="#94a3b8" font-size="14">
      Comparing Enterprise SaaS Platforms &amp; Community GitHub Repositories for Modern Analytics &amp; MLOps
    </text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(140, 266)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="42" rx="10" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" class="pill-border" />
        <text x="105" y="26" text-anchor="middle" fill="#f1f5f9" class="pill-text">🏢 Enterprise SaaS Platforms</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(235, 0)">
        <rect width="215" height="42" rx="10" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" class="pill-border" />
        <text x="107" y="26" text-anchor="middle" fill="#f1f5f9" class="pill-text">📓 Interactive Notebooks</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(475, 0)">
        <rect width="210" height="42" rx="10" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.2" class="pill-border" />
        <text x="105" y="26" text-anchor="middle" fill="#f1f5f9" class="pill-text">⚡ MLOps &amp; AI Runtimes</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(710, 0)">
        <rect width="210" height="42" rx="10" fill="url(#pillGrad)" stroke="#f472b6" stroke-width="1.2" class="pill-border" />
        <text x="105" y="26" text-anchor="middle" fill="#f1f5f9" class="pill-text">🔬 Open-Source Tooling</text>
      </g>
    </g>

    <!-- Bottom Metric / Status Indicator -->
    <g transform="translate(485, 335)">
      <text x="115" y="16" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="500">
        ✨ Updated for 2026 • Curated with Community Insights
      </text>
    </g>
  </g>
</svg>
